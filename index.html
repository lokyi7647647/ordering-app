<html>
  <head>
    <link rel="stylesheet" href="index.css" />
    <script src="index.js" type="module"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Smythe&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css" />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/utility.css" />
    <link rel="stylesheet" href="css/components/menu.css" />
  </head>
  <body>
    <header>
      <h1 class="font-weight-regular">Jimmy’s Diner</h1>
      <p id="advertisement" class="font-weight-regular">
        The best burgers and pizzas in town.
      </p>
    </header>
    <main>
      <section>
        <ul>
          <li class="item-container position-relative display-flex">
            <div class="item-inner-container">
              <img
                class="item-image-size"
                src="assets/pizza.png"
                alt="A slice of pepperoni pizza"
              />
              <div class="item-inner-desc-container">
                <h2 class="font-weight-regular">Pizza</h2>
                <p class="color-light">pepperoni,mushrom,mozarella</p>
                <p class="font-size-20px">$14</p>
              </div>
            </div>
            <button class="add-btn">
              <span class="position-relative">+</span>
            </button>
          </li>

          <li class="item-container position-relative display-flex">
            <div class="item-inner-container">
              <img
                class="item-image-size"
                src="assets/hamburger.png"
                alt="A hamburger with tomato, cheese, patty, and lettuce between two buns"
              />
              <div class="item-inner-desc-container">
                <h2 class="font-weight-regular">Hamburger</h2>
                <p class="color-light">beef, cheese, lettuce</p>
                <p class="font-size-20px">$12</p>
              </div>
            </div>
            <button class="add-btn">
              <span class="position-relative">+</span>
            </button>
          </li>

          <li class="item-container position-relative display-flex">
            <div class="item-inner-container">
              <img
                class="item-image-size"
                src="assets/beer.png"
                alt="A bear mug filled with beer"
              />
              <div class="item-inner-desc-container">
                <h2 class="font-weight-regular">Beer</h2>
                <p class="color-light">grain, hops, yeast, water</p>
                <p class="font-size-20px">$12</p>
              </div>
            </div>
            <button class="add-btn">
              <span class="position-relative">+</span>
            </button>
          </li>
        </ul>
      </section>
    </main>
  </body>
</html>
