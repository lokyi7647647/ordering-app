<!doctype html>
<html lang="en">
  <html>
    <head>
      <link rel="preconnect" href="https://fonts.googleapis.com" />
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Smythe&display=swap"
        rel="stylesheet"
      />
      <link rel="stylesheet" href="css/index.css" />
      <link rel="stylesheet" href="css/base.css" />
      <link rel="stylesheet" href="css/utility.css" />
      <link rel="stylesheet" href="css/components/menu.css" />
      <link rel="stylesheet" href="css/components/receipt.css" />
      <script src="index.js" type="module"></script>
    </head>
    <body>
      <header>
        <h1 class="font-weight-regular">Jimmy’s Diner</h1>
        <p id="advertisement" class="font-weight-regular">
          The best burgers and pizzas in town.
        </p>
      </header>
      <main>
        <ul id="menu"></ul>
        <article id="receipt">
          <h2 id="receipt-title" class="font-weight-regular">Your order</h2>
          <ul class="receipt-list">
            <li class="display-flex receipt-item-container">
              <div class="display-flex receipt-item-desc-container">
                <h3 class="font-weight-regular">Pizza</h3>
                <button class="remove-btn">remove</button>
              </div>
              <p class="font-size-20px">$14</p>
            </li>
            <li class="display-flex receipt-item-container">
              <div class="display-flex receipt-item-desc-container">
                <h3 class="font-weight-regular">Beer</h3>
                <button class="remove-btn">remove</button>
              </div>
              <p class="font-size-20px position-relative price-pos-offset">
                $12
              </p>
            </li>
            <li class="display-flex receipt-item-container">
              <div class="display-flex receipt-item-desc-container">
                <h3 class="font-weight-regular">Beer</h3>
                <button class="remove-btn">remove</button>
              </div>
              <p class="font-size-20px position-relative price-pos-offset">
                $12
              </p>
            </li>
            <div class="border-bottom-black"></div>
            <li class="display-flex receipt-item-container">
              <div class="display-flex receipt-item-desc-container">
                <h3 class="font-weight-regular">Total price:</h3>
              </div>
              <p class="font-size-20px position-relative price-pos-offset">
                $26
              </p>
            </li>
          </ul>
        </article>
      </main>
    </body>
  </html>
</html>
